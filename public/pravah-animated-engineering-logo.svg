<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 720" role="img" aria-labelledby="title desc">
<title id="title">Technical festival circuit logo</title>
<desc id="desc">Animated engineering circuit logo with six independent terminal icons and a rotating central infinity symbol.</desc>
<defs>
 <radialGradient id="coreGlow"><stop offset="0" stop-color="#fff"/><stop offset=".63" stop-color="#edffff"/><stop offset=".84" stop-color="#acecf3"/><stop offset="1" stop-color="#20a8ca"/></radialGradient>

<style><![CDATA[
  /* Built-in animation. Keep the SVG inline or load with <object> to target these IDs from JS/GSAP. */
  #infinity {
    transform-box: view-box;
    transform-origin: 300px 360px;
    animation: infinitySpin 7s linear infinite;
    will-change: transform;
  }

  .terminal-icon {
    animation: terminalPulse 2.6s ease-in-out infinite;
    will-change: opacity, filter;
  }
  #icon-0 { --terminal-color: #ef9b20; animation-delay: 0s; }
  #icon-1 { --terminal-color: #79b33e; animation-delay: -0.43s; }
  #icon-2 { --terminal-color: #20a3ad; animation-delay: -0.86s; }
  #icon-3 { --terminal-color: #163d60; animation-delay: -1.29s; }
  #icon-4 { --terminal-color: #087cab; animation-delay: -1.72s; }
  #icon-5 { --terminal-color: #873293; animation-delay: -2.15s; }

  @keyframes infinitySpin {
    from { transform: rotate(0deg); }
    to   { transform: rotate(360deg); }
  }

  @keyframes terminalPulse {
    0%   { opacity: 0.7;  filter: drop-shadow(0 0 0px var(--terminal-color)); }
    15%  { opacity: 0.96; filter: drop-shadow(0 0 6px var(--terminal-color)); }
    23%  { opacity: 0.78; filter: drop-shadow(0 0 3px var(--terminal-color)); }
    50%  { opacity: 1;    filter: drop-shadow(0 0 9px var(--terminal-color)); }
    63%  { opacity: 0.85; filter: drop-shadow(0 0 5px var(--terminal-color)); }
    100% { opacity: 0.7;  filter: drop-shadow(0 0 0px var(--terminal-color)); }
  }

  /* Light particle that flows along each circuit toward its terminal. */
  .flow-dot {
    will-change: transform, opacity;
    filter: drop-shadow(0 0 6px currentColor) drop-shadow(0 0 2px #fff);
  }

  /* Optional interaction when the SVG is inline / embedded as an object. */
  .terminal-icon:hover {
    opacity: 1;
    filter: drop-shadow(0 0 12px var(--terminal-color));
  }

  @media (prefers-reduced-motion: reduce) {
    #infinity, .terminal-icon { animation: none !important; }
    .flow-dot { display: none; }
  }
]]></style>
</defs>
